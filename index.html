<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista della spesa</title>
  <link rel="stylesheet" href="style.css?v=20260617" />
</head>

<body>
  <main class="app">
    <header>
      <h1>Lista della spesa</h1>
      <p class="subtitle">Tocca un prodotto per spostarlo tra catalogo, da comprare e comprato.</p>

      <div class="stats">
        <div class="stat">
          <strong id="countCatalog">37</strong>
          <span>Catalogo</span>
        </div>
        <div class="stat">
          <strong id="countToBuy">0</strong>
          <span>Da comprare</span>
        </div>
        <div class="stat">
          <strong id="countBought">0</strong>
          <span>Comprati</span>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Cerca prodotto...">
        <button id="clearSearch">Pulisci</button>
      </div>
    </header>

    <section>
      <div class="section-title">
        <h2>Da comprare</h2>
        <span class="hint">tocca quando lo compri</span>
      </div>
      <div id="toBuyList" class="grid"></div>
      <div id="toBuyEmpty" class="empty">Nessun prodotto da comprare.</div>
    </section>

    <section>
      <div class="section-title">
        <h2>Prodotti extra</h2>
      </div>
      <textarea id="extraNotes" class="extra-notes" placeholder="Scrivi qui altri prodotti..."></textarea>
    </section>

    <section>
      <div class="section-title">
        <h2>Comprati</h2>
        <span class="hint">tocca per rimettere nel catalogo</span>
      </div>
      <div id="boughtList" class="grid"></div>
      <div id="boughtEmpty" class="empty">Nessun prodotto comprato.</div>
    </section>

    <section>
      <div class="section-title">
        <h2>Catalogo</h2>
        <button id="resetBought">Fine spesa</button>
      </div>
      <div id="catalog"></div>
    </section>
  </main>

  <script src="script.js?v=20260617"></script>
</body>
</html>
